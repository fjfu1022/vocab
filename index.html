/* ---------- home ---------- */
.home{padding:30px 0 36px}
.home h1{margin:6px 0 8px;line-height:1.08}
.home h1 .d{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(38px,11vw,52px);letter-spacing:-.015em}
.home h1 .t{display:block;font-weight:700;font-size:clamp(26px,7.4vw,34px);letter-spacing:-.02em;margin-top:2px}
.sub{color:var(--soft);margin:0 0 28px;font-size:15px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 16px;background:var(--card);border-radius:14px;border-left:5px solid var(--hl-solid);margin-bottom:26px}
.resume b{display:block;font-size:15px;font-weight:600}
.resume span{display:block;font-size:13.5px;color:var(--soft)}
.resume small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.block{margin-bottom:18px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.block-head h2{font-size:15px;font-weight:600;margin:0}
.textbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:500;padding:6px 2px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.day small{font-size:11px;color:var(--faint)}
.day b{font-family:var(--serif);font-size:23px;font-weight:600;font-variant-numeric:lining-nums}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.count{font-size:13.5px;color:var(--soft);margin:10px 0 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--card);border-radius:14px;margin:0 0 22px;cursor:pointer;position:relative}
.switch b{display:block;font-size:15px;font-weight:600}
.switch small{display:block;font-size:13px;color:var(--soft)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2.5px solid var(--accent);outline-offset:2px}
.modes{display:grid;gap:10px}
.mode{display:block;text-align:left;width:100%;border-radius:16px;padding:17px 18px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode strong{display:block;font-size:18px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}
.mode span{display:block;font-size:13.5px;line-height:1.55;opacity:.86;word-break:keep-all}
.mode:disabled{opacity:.4;cursor:not-allowed}

.study{height:100%;min-height:360px;display:flex;flex-direction:column;padding:6px 0 14px}
.topbar{display:flex;align-items:center;justify-content:space-between;height:50px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.25;cursor:default}
.where{text-align:center;line-height:1.25}
.where b{display:block;font-size:15px;font-weight:600}
.where span{font-size:12.5px;color:var(--soft)}

.meta-row b{font-family:var(--serif);font-size:17px;color:var(--ink)}
.answer{margin-top:24px}
.answer input{width:100%;height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--serif);font-size:23px;padding:0 16px;text-align:center;-webkit-appearance:none;appearance:none}
.answer input::placeholder{font-family:var(--sans);font-size:15px;color:var(--faint)}
.answer input:focus{outline:none;border-color:var(--accent)}
.answer input.ok{border-color:var(--know);background:var(--know-tint)}
.answer input.no{border-color:var(--dont);background:var(--dont-tint)}
.answer input.no.typed{text-decoration:line-through;text-decoration-color:var(--dont)}
.result{margin:12px 2px 0;font-size:15px;text-align:center}
.result.is-ok{color:var(--know);font-weight:600}
.result.is-no{color:var(--dont)}
.result .right{font-family:var(--serif);font-weight:600;font-size:23px;color:var(--ink);margin-left:4px}
.actions{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage.type .actions{margin-top:14px}
.btn{white-space:nowrap;height:56px;border-radius:14px;border:0;font-size:17px;font-weight:600;cursor:pointer;padding:0 14px}
.btn.wide{grid-column:1/-1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.know{background:var(--know);color:var(--know-ink)}
.btn.dont{background:var(--card);color:var(--dont);border:1.5px solid var(--dont)}
.btn.sm{height:42px;padding:0 16px;font-size:15px;flex:none}

/* ---------- round end / done ---------- */
.panel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 2px}
.panel h2,.page h2{font-size:clamp(26px,7.4vw,32px);font-weight:700;letter-spacing:-.02em;margin:0 0 6px;line-height:1.25}
.lead{color:var(--soft);font-size:15.5px;margin:0;word-break:keep-all}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:24px 0 10px}
.split .k{background:var(--know)}
.split .u{background:var(--dont)}
.legend{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600;margin-bottom:22px}
.legend .k{color:var(--know)}
.legend .u{color:var(--dont)}
.page{min-height:100%;padding:6px 2px 28px}
.page .topbar{margin:0 -2px 10px}
.page h3{font-size:15px;font-weight:600;margin:4px 0 10px}
.review{list-style:none;margin:0 0 22px;padding:2px 16px;background:var(--card);border-radius:14px}
.review li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.review .w{font-family:var(--serif);font-weight:600;font-size:17px;flex:0 0 42%;overflow-wrap:anywhere}
.review .m{color:var(--soft);font-size:14px;word-break:keep-all}

@media (prefers-reduced-motion: reduce){
  .card.enter,.back-en.show{animation:none}
  .bar i,.switch i,.switch i::after{transition:none}
}

  clockMove(next < 0 ? null : S.queue[next]);
  S.input = ''; S.correct = null; S.gaveUp = false; S.hint = false;
  if (next < 0) { S.idx = S.queue.length; S.phase = S.next.length ? 'round' : 'done'; if (S.phase === 'done') clockArchive(); }
  else { S.idx = next; S.phase = 'q'; animIn = true; }
  persist(); render();
}
function nextRound() {
  if (!S || S.phase !== 'round') return;
  snap();
  S.queue = S.shuffle ? shuffled(S.next) : S.next.slice();
  S.next = []; S.answers = {}; S.idx = 0; S.round++; S.rk = 0; S.ru = 0; S.phase = 'q'; animIn = true;
  clockMove(S.queue[0]);
  persist(); render();
}
function undo() {
  if (!history.length) return;
  const previous = JSON.parse(history.pop()); S = previous.session; memory = previous.memory; saveMemory(); revealAt = 0;
  clockMove(['q','a'].includes(S.phase) ? S.queue[S.idx] : null);
  persist(); render();
}
function check() {
  if (!S || S.mode !== 'type' || S.phase !== 'q') return;
  const el = document.getElementById('ans');
  const v = el ? el.value : '';
  if (!v.trim()) { if (el) el.focus(); return; }
  const w = W[S.queue[S.idx]];
  S.input = v.trim(); S.correct = norm(v) === norm(w.en); S.gaveUp = false;
  S.phase = 'a'; revealAt = Date.now();
  persist(); render();
}
function giveUp() {
  if (!S || S.mode !== 'type' || S.phase !== 'q') return;
  S.input = ''; S.correct = false; S.gaveUp = true; S.phase = 'a'; revealAt = Date.now();
  persist(); render();
}
function nextTyped() { if (S && S.mode === 'type' && S.phase === 'a') mark(S.correct); }

/* ---------- views ---------- */
function renderHome() {
  const sel = new Set(prefs.days);
  const n = prefs.days.reduce((s, d) => s + idsForDay(d).length, 0);
  const saved = S && S.phase !== 'done' ? S : null;
  let savedPos = '';
  if (saved) savedPos = saved.phase === 'round' ? saved.round + '회차 끝' : saved.round + '회차 ' + Math.min(saved.idx + 1, saved.queue.length) + '/' + saved.queue.length;
  app.innerHTML = `
  <div class="home">
    <h1><span class="d">Day 37–48</span><span class="t">단어 카드</span></h1>
    <p class="sub">수능 2000 (2023 개정판), 하루 40단어씩 480단어</p>
    ${saved ? `<div class="resume">
      <div><b>하던 거 이어하기</b><span>${modeName(saved.mode)}, ${esc(dayLabel(saved.days))}, ${savedPos}</span><small>새로 시작하면 이 기록은 지워져요</small></div>
      <button class="btn primary sm" data-act="resume">이어하기</button>
    </div>` : ''}
    <section class="block">
      <div class="block-head"><h2>외울 Day</h2><button class="textbtn" data-act="all">${sel.size === DAYS.length ? '전체 해제' : '전체 선택'}</button></div>
      <div class="days">${DAYS.map(d => `<button class="day" data-day="${d}" aria-pressed="${sel.has(d)}" aria-label="Day ${d}"><small>Day</small><b>${d}</b></button>`).join('')}</div>
      <p class="count">${sel.size ? `${sel.size}개 Day, ${n}단어` : 'Day를 하나 이상 골라 주세요'}</p><label class="switch"><span><b>맞춤문제</b><small>고른 Day 안에서 선택한 유형의 점수 하위 30%를 출제해요</small></span><input type="checkbox" data-act="custom" ${prefs.custom ? 'checked' : ''}><i></i></label>
    </section>
    ${timeHistory()}
    <section class="block"><div class="block-head"><h2>단어별 점수 변화</h2></div><input id="word-search" placeholder="영어 단어 또는 뜻 검색" autocomplete="off" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><div id="word-results"></div><div id="word-chart"></div><p class="sub">유형별 기록은 이번 변경 이후부터 저장돼요. 이전 점수는 유형을 구분할 수 없어 기존 데이터로 보존돼요.</p></section>
    <label class="switch"><span><b>순서 섞기</b><small>끄면 단어장 순서대로 나와요</small></span><input type="checkbox" data-act="shuffle" ${prefs.shuffle ? 'checked' : ''}><i aria-hidden="true"></i></label>
    <div class="modes">
      <button class="mode primary" data-act="start-card" ${sel.size ? '' : 'disabled'}><strong>영어 보고 뜻 맞히기</strong><span>카드를 눌러 뜻을 확인하고 알아요, 몰라요로 나눠요. 모르는 단어는 한 바퀴를 다 돈 뒤 맨 뒤에 다시 나와요.</span></button>
      <button class="mode" data-act="start-rcard" ${sel.size ? '' : 'disabled'}><strong>뜻 보고 영어 맞히기</strong><span>뜻을 보고 영어 단어를 떠올린 다음 카드를 눌러 확인해요. 알아요, 몰라요로 나누는 방식은 똑같아요.</span></button>
      <button class="mode" data-act="start-type" ${sel.size ? '' : 'disabled'}><strong>뜻 보고 영어 쓰기</strong><span>뜻을 보고 철자를 직접 입력해요. 틀린 단어도 한 바퀴를 다 돈 뒤 다시 나와요.</span></button>
    </div>
  </div>`;
}

function topbar() {
  return `<header class="topbar">
    <button class="iconbtn" data-act="home" aria-label="처음으로">${ICON.close}</button>
    <div class="where"><b>${esc(dayLabel(S.days))}</b><span>${S.round}회차, ${modeShort(S.mode)}</span></div>
    <button class="iconbtn" data-act="undo" aria-label="되돌리기" ${history.length ? '' : 'disabled'}>${ICON.undo}</button>
  </header>`;
}

function renderStudy() {
  if (S.phase === 'round') return renderRound();
  if (S.phase === 'done') return renderDone();
  const w = W[S.queue[S.idx]];
  const len = S.queue.length, pos = S.idx + 1;
  const deckLeft = Math.min(len - pos, 2);
  const progress = `<div class="progress"><div class="bar"><i style="width:${(S.idx / len) * 100}%"></i></div>
    <div class="pmeta"><span>${pos} / ${len}</span><span class="${S.next.length ? 'again' : ''}">다시 볼 단어 ${S.next.length}</span></div></div>`;
  const tag = `<span class="tag">Day ${w.day}, ${w.no}번 · 기억 ${Math.round(score(w.id))}점</span>`;
  let body;
  if (isFlip(S.mode)) {
    const revealed = S.phase === 'a';
    const rev = S.mode === 'rcard';
    const what = rev ? '영어' : '뜻';
    const enEl = `<div class="en${w.en.length > 10 ? ' long' : ''}" lang="en">${esc(w.en)}</div>`;
    const front = rev ? `<p class="ko front">${esc(w.ko)}</p>` : enEl;
    const back = rev ? `<div class="back-en${justRevealed ? ' show' : ''}">${enEl}</div>` : `<p class="meaning"><mark>${esc(w.ko)}</mark></p>`;
    body = `<div class="stage">
      <div class="deck" data-left="${deckLeft}">
        <div class="card${revealed ? '' : ' tappable'}${animIn ? ' enter' : ''}" ${revealed ? '' : `data-act="reveal" role="button" tabindex="0" aria-label="${what} 보기"`}>
          ${tag}
          ${front}
          ${revealed ? back : `<p class="tap-hint">눌러서 ${what} 보기</p>`}
        </div>
      </div>
    </div>
    <div class="actions">${revealed
      ? `<button class="btn dont" data-act="dont">몰라요</button><button class="btn know" data-act="know">알아요</button>`
      : `<button class="btn primary wide" data-act="reveal">${what} 보기</button>`}</div>`;
  } else {
    const done = S.phase === 'a';
    const hint = S.hint ? `첫 글자 <b lang="en">${esc(w.en[0])}</b>` : `<button class="textbtn" data-act="hint">첫 글자 힌트</button>`;
    let inputCls = '';
    if (done) inputCls = S.correct ? 'ok' : ('no' + (S.gaveUp ? '' : ' typed'));
    const result = !done ? '' : S.correct
      ? `<p class="result is-ok">정답이에요</p>`
      : `<p class="result is-no">${S.gaveUp ? '정답은' : '틀렸어요. 정답은'}<b class="right" lang="en">${esc(w.en)}</b></p>`;
    body = `<div class="stage type">
      <div class="deck" data-left="${deckLeft}">
        <div class="card prompt${animIn ? ' enter' : ''}">
          ${tag}
          <p class="ko">${esc(w.ko)}</p>
          <div class="meta-row"><span>${w.en.length}글자</span>${done ? '' : `<span>${hint}</span>`}</div>
        </div>
      </div>
      <div class="answer">
        <input id="ans" class="${inputCls}" type="text" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          enterkeyhint="${done ? 'next' : 'done'}" placeholder="${done && S.gaveUp ? '모르는 단어로 넘겼어요' : '영어 철자 입력'}"
          value="${esc(S.input)}" aria-label="영어 철자" ${done ? 'aria-readonly="true"' : ''}>
        ${result}
      </div>
      <div class="actions">${done
        ? `<button class="btn primary wide" data-act="next">다음 단어</button>`
        : `<button class="btn ghost" data-act="giveup">모르겠어요</button><button class="btn primary" data-act="check">확인</button>`}</div>
    </div>`;
  }
  app.innerHTML = `<div class="study">${topbar()}${clockBar()}${progress}${body}</div>`;
}

function renderRound() {
  const tot = S.rk + S.ru, kp = tot ? (S.rk / tot) * 100 : 0;
  const lab = isFlip(S.mode) ? ['알아요', '몰라요', '몰랐던'] : ['맞힘', '틀림', '틀린'];
  app.innerHTML = `<div class="study">${topbar()}${clockBar()}
    <div class="progress"><div class="bar"><i style="width:100%"></i></div>
      <div class="pmeta"><span>${S.queue.length} / ${S.queue.length}</span><span class="again">다시 볼 단어 ${S.next.length}</span></div></div>
    <div class="panel">
      <h2>${S.round}회차를 다 돌았어요</h2>
      <p class="lead">${lab[2]} 단어 ${S.next.length}개만 모아서 다시 볼게요.</p>
      <div class="split" role="img" aria-label="${lab[0]} ${S.rk}개, ${lab[1]} ${S.ru}개"><i class="k" style="width:${kp}%"></i><i class="u" style="width:${100 - kp}%"></i></div>
      <div class="legend"><span class="k">${lab[0]} ${S.rk}개</span><span class="u">${lab[1]} ${S.ru}개</span></div>
    </div>
    <div class="actions"><button class="btn primary wide" data-act="round">${S.round + 1}회차 시작</button></div>
  </div>`;
}

function renderDone() {
  const missed = S.missed.map(id => W[id]);
  const verb = isFlip(S.mode) ? '알았어요' : '맞혔어요';
  const kp = (S.firstKnown / S.total) * 100;
  const lead = S.round === 1
    ? `${S.total}단어를 한 번에 전부 ${verb}.`
    : `${S.total}단어 중 ${S.firstKnown}개는 처음부터 ${isFlip(S.mode) ? '알았고' : '맞혔고'}, 나머지는 ${S.round}회차 만에 전부 ${verb}.`;
  app.innerHTML = `<div class="page">
    <header class="topbar"><button class="iconbtn" data-act="home" aria-label="처음으로">${ICON.close}</button><span></span><span style="width:44px"></span></header>
    <h2>${esc(dayLabel(S.days))} 끝!</h2>
    <p class="lead">${lead}</p>
    <div class="split" role="img" aria-label="1회차 기준"><i class="k" style="width:${kp}%"></i><i class="u" style="width:${100 - kp}%"></i></div>
    <div class="legend"><span class="k">1회차에 ${isFlip(S.mode) ? '안' : '맞힌'} 단어 ${S.firstKnown}개</span><span class="u">헷갈린 단어 ${missed.length}개</span></div>
    ${missed.length ? `<h3>헷갈렸던 단어</h3>
    <ul class="review">${missed.map(w => `<li><span class="w" lang="en">${esc(w.en)}</span><span class="m">${esc(w.ko)}</span></li>`).join('')}</ul>` : ''}
    <div class="actions"><button class="btn ghost" data-act="home">처음으로</button><button class="btn primary" data-act="again">다시 하기</button></div>
  </div>`;
}

function render() {
  if (view === 'home' || !S) { view = 'home'; renderHome(); }
  else renderStudy();
  animIn = false; justRevealed = false;
  const ans = document.getElementById('ans');
  if (ans) {
    ans.addEventListener('beforeinput', ev => { if (S && S.phase === 'a') ev.preventDefault(); });
    try { ans.focus({ preventScroll: true }); const L = ans.value.length; ans.setSelectionRange(L, L); } catch (e) {}
  }
  clockPaint();
}

function showWord(id) { const w=W[id], el=document.getElementById('word-chart'); if(!w||!el)return; const colors={card:'#a64e38',rcard:'#397b75',type:'#496aa3'}; const all=Object.keys(MODES).flatMap(m=>(memory.events?.[m]?.[id]||[]).map(e=>({...e,mode:m}))).sort((a,b)=>a.at-b.at); let svg=''; if(all.length){ const min=all[0].at,max=all[all.length-1].at; const x=t=>30+(max===min?210:(t-min)/(max-min)*420); const y=v=>110-v; svg='<svg viewBox="0 0 480 220" role="img" aria-label="시간에 따른 유형별 기억 점수" style="width:100%;max-width:600px"><line x1="30" y1="110" x2="450" y2="110" stroke="#aaa"/><text x="2" y="14">100</text><text x="8" y="114">0</text><text x="0" y="214">-100</text>'+Object.keys(MODES).map(m=>{const es=all.filter(e=>e.mode===m);return '<polyline fill="none" stroke="'+colors[m]+'" stroke-width="3" points="'+es.map(e=>x(e.at)+','+y(e.value)).join(' ')+'"/>'+es.map(e=>'<circle cx="'+x(e.at)+'" cy="'+y(e.value)+'" r="4" fill="'+colors[m]+'"><title>'+new Date(e.at).toLocaleString('ko-KR')+' · '+e.value.toFixed(1)+'점</title></circle>').join('')}).join('')+'</svg><p class="sub">'+new Date(min).toLocaleDateString('ko-KR')+' ~ '+new Date(max).toLocaleDateString('ko-KR')+'</p>'; } el.innerHTML='<h3>'+esc(w.en)+' · '+esc(w.ko)+'</h3>'+Object.keys(MODES).map(m=>'<p style="color:'+colors[m]+'">● '+MODES[m]+': '+(memory.byMode?.[m]?.[id] ? Math.round(score(id,Date.now(),m))+'점' : '기록 없음')+'</p>').join('')+(svg||'<p>아직 점수 변화 기록이 없어요.</p>'); }
app.addEventListener('input', e=>{if(e.target.id!=='word-search')return; const q=e.target.value.trim().toLowerCase(), out=document.getElementById('word-results'); out.innerHTML=q?Object.values(W).filter(w=>w.en.toLowerCase().includes(q)||w.ko.toLowerCase().includes(q)).slice(0,30).map(w=>'<button class="textbtn" data-word="'+esc(w.id)+'">'+esc(w.en)+' · '+esc(w.ko)+' (Day '+w.day+')</button>').join('')||'<p>검색 결과 없음</p>':'';});
/* ---------- events ---------- */
app.addEventListener('click', e => {
  const wordBtn=e.target.closest('[data-word]'); if(wordBtn){showWord(wordBtn.dataset.word);return;}
  const dayBtn = e.target.closest('[data-day]');
  if (dayBtn) {
    const d = +dayBtn.dataset.day, i = prefs.days.indexOf(d);
    if (i >= 0) prefs.days.splice(i, 1); else prefs.days.push(d);
    prefs.days.sort((a, b) => a - b); savePrefs(); render(); return;
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  switch (t.dataset.act) {
    case 'all': prefs.days = prefs.days.length === DAYS.length ? [] : DAYS.slice(); savePrefs(); render(); break;
    case 'start-custom': startCustom(); break;
    case 'start-card': prefs.custom ? startCustom('card') : startWith('card', prefs.days, prefs.shuffle); break;
    case 'start-rcard': prefs.custom ? startCustom('rcard') : startWith('rcard', prefs.days, prefs.shuffle); break;
    case 'start-type': prefs.custom ? startCustom('type') : startWith('type', prefs.days, prefs.shuffle); break;
    case 'resume': if (S) { view = 'study'; history = []; animIn = true; if (!timeLog.active) clockStart(); else { timeLog.active.wordId = ['q','a'].includes(S.phase) ? S.queue[S.idx] : null; timeLog.active.lastAt = Date.now(); saveTime(); } render(); } break;
    case 'home': clockSync(); view = 'home'; if(timeLog.active) { timeLog.active.lastAt = Date.now(); saveTime(); } render(); window.scrollTo(0, 0); break;
    case 'clock-toggle': clockSync(); if (timeLog.active) { timeLog.active.manualPause = !timeLog.active.manualPause; timeLog.active.lastAt = Date.now(); saveTime(); clockPaint(); } break;
    case 'undo': undo(); break;
    case 'reveal': reveal(); break;
    case 'know': mark(true); break;
    case 'dont': mark(false); break;
    case 'check': check(); break;
    case 'giveup': giveUp(); break;
    case 'next': nextTyped(); break;
    case 'hint': { const el = document.getElementById('ans'); if (el) S.input = el.value; S.hint = true; persist(); render(); break; }
    case 'round': nextRound(); break;
    case 'again': S.custom ? startCustom(S.mode, S.days) : startWith(S.mode, S.days, S.shuffle); window.scrollTo(0, 0); break;
  }
});
app.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'custom') { prefs.custom = e.target.checked; savePrefs(); render(); }
  if (e.target.dataset && e.target.dataset.act === 'shuffle') { prefs.shuffle = e.target.checked; savePrefs(); }
});
// 쓰기 모드에서 버튼을 눌러도 입력칸 포커스(키보드)가 유지되게
app.addEventListener('mousedown', e => {
  if (view === 'study' && S && S.mode === 'type' && e.target.closest('button')) e.preventDefault();
});
document.addEventListener('keydown', e => {
  if (view !== 'study' || !S || e.isComposing || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if (e.target.closest('#clock-toggle')) return;
  const actionKey = e.key === ' ' || e.key === 'Enter';
  if (S.phase === 'round') {
    if (actionKey) { e.preventDefault(); if (!e.repeat) nextRound(); }
    return;
  }
  if (isFlip(S.mode) && ['q', 'a'].includes(S.phase)) {
    if (!actionKey && !['Backspace', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    e.preventDefault();
    if (e.repeat) return;
    if (e.key === 'ArrowLeft') moveCard(-1);
    else if (e.key === 'ArrowRight') moveCard(1);
    else if (actionKey && S.phase === 'q') reveal();
    else {
      // A separate press grades the revealed card; Backspace also works directly.
      S.phase = 'a'; revealAt = 0;
      mark(e.key !== 'Backspace');
    }
  } else if (S.mode === 'type' && e.key === 'Enter' && e.target.id === 'ans') {
    e.preventDefault();
    if (e.repeat) return;
    if (S.phase === 'q') check(); else nextTyped();
  }
}, true);

window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'vocab-visibility') return;
  clockSync(); widgetActive = !!e.data.active;
  if (timeLog.active) { timeLog.active.lastAt = Date.now(); saveTime(); }
  clockPaint();
});
document.addEventListener('visibilitychange', () => {
  if (timeLog.active) { timeLog.active.lastAt = Date.now(); saveTime(); }
  clockPaint();
});
window.addEventListener('pagehide', () => { clockSync(); saveTime(); });
setInterval(() => { if (clockRunning()) { clockSync(); saveTime(); } clockPaint(); }, 1000);
render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
